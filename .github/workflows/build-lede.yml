name: build lede

on:
  workflow_dispatch:
    inputs:
      model:
        description: '选择设备'
        required: true
        type: choice
        options:
          - 'xiaomi-cr6606'
          - 'xiaomi-4a-gigabit'
          - 'redmi-ax6s'
          # 其他机型保留...
      lan_ipad:
        description: '设置LAN口IP地址'
        required: false
        default: ''
        type: string
      login_pwd:
        description: '设置初始登陆密码'
        required: false
        default: ''
        type: string
      record:
        description: '输入版本描述'
        required: false
        default: 'CR6606 定制固件 SSR+/PassWall2/FRPC'
        type: string
      cpu_overclock:
        description: '超频到1100Mhz'
        required: false
        type: boolean
      kernel_5_15:
        description: '使用5.15内核'
        required: false
        type: boolean
      release:
        description: '上传到release'
        required: false
        default: true
        type: boolean
      artifact:
        description: '上传到artifact'
        required: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # 强制使用 Node.js 24 解决弃用问题
    steps:
      - name: 显示初始磁盘空间
        run: df -h

      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 准备编译环境
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison quilt libssl-dev libelf-dev python3 python3-pip unzip git wget rsync
          pip3 install pyyaml toml

      - name: 准备部署配置
        id: prepare
        run: |
          chmod +x extra-files/transit.py
          python3 extra-files/transit.py
        env:
          MODEL_NAME: ${{ inputs.model }}
          LOGIN_IP: ${{ inputs.lan_ipad }}
          LOGIN_PWD: ${{ inputs.login_pwd }}

      - name: 克隆 OpenWrt 源码
        run: |
          chmod +x ${{ steps.prepare.outputs.clone_sh }}
          ${{ steps.prepare.outputs.clone_sh }}

      - name: 添加插件 (SSRPlus & PassWall2)
        run: |
          cd lede
          git clone https://github.com/fw876/helloworld.git package/helloworld
          git clone https://github.com/xiaorouji/openwrt-passwall2.git package/passwall2

      - name: 更新 feeds
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 修改配置文件
        run: |
          cd lede
          chmod +x ${{ steps.prepare.outputs.modify_sh }}
          ${{ steps.prepare.outputs.modify_sh }}
        env:
          CPUO: ${{ inputs.cpu_overclock }}
          K515: ${{ inputs.kernel_5_15 }}

      - name: 生成 .config 并启用插件
        run: |
          cd lede
          mv ${{ steps.prepare.outputs.dot_config }} .config
          
          # 启用你需要的插件
          echo "CONFIG_PACKAGE_luci-app-ssr-plus=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall2=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-frpc=y" >> .config
          
          # 精简无用插件
          echo "CONFIG_PACKAGE_luci-app-qbittorrent is not set" >> .config
          echo "CONFIG_PACKAGE_luci-app-transmission is not set" >> .config
          echo "CONFIG_PACKAGE_luci-app-zerotier is not set" >> .config
          echo "CONFIG_PACKAGE_luci-app-hd-idle is not set" >> .config
          
          make defconfig

      - name: 下载源码依赖
        run: |
          cd lede
          make download -j8 || make download -j1 V=s

      - name: 开始编译
        run: |
          cd lede
          make -j$(nproc) || make -j1 V=s

      - name: 收集固件文件
        run: |
          cd lede
          mkdir -p _collected
          cp $(find bin/targets/ -name "*${{ inputs.model }}*.bin") _collected/
          cp $(find bin/targets/ -name "*${{ inputs.model }}*.img.gz") _collected/
          cd _collected
          zip -r firmware_${{ inputs.model }}.zip *

      - name: 上传固件到 Release
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          files: lede/_collected/firmware_${{ inputs.model }}.zip
          tag_name: "build-${{ github.sha }}"
          name: "CR6606 Custom Build ${{ github.sha }}"
          body: |
            ${{ inputs.record }}
            - 设备: ${{ inputs.model }}
            - 内核: ${{ inputs.kernel_5_15 && '5.15' || '默认' }}
            - 功能: SSRPlus / PassWall2 / FRPC
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传固件到 Artifact
        if: ${{ inputs.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.model }}-firmware
          path: lede/_collected/
