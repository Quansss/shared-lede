name: build lede

on:
  workflow_dispatch:
    inputs:
      model:
        description: '选择设备'
        required: true
        type: choice
        options:
          - 'xiaomi-cr6606'
          - 'xiaomi-4a-gigabit'
          - 'redmi-ax6s'
      lan_ipad:
        description: '设置LAN口IP地址'
        required: false
        default: ''
        type: string
      login_pwd:
        description: '设置初始登陆密码'
        required: false
        default: ''
        type: string
      record:
        description: '版本描述'
        required: false
        default: 'CR6606 定制版'
        type: string
      cpu_overclock:
        description: '超频'
        required: false
        type: boolean
      kernel_5_15:
        description: '5.15内核'
        required: false
        type: boolean
      release:
        description: '上传Release'
        required: false
        default: true
        type: boolean
      artifact:
        description: '上传Artifact'
        required: false
        type: boolean

permissions:
  contents: write

jobs:
  to-build:
    name: build
    runs-on: ubuntu-latest
    env:
      EXTRA_STR: _some
    steps:

      # 🔥 移除：hugcabbage/action-hide-sensitive-inputs@v1（导致失败的罪魁祸首）
      
      - name: Display initial disk space
        run: df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ env.EXTRA_STR }}

      - name: Prepare environments
        env:
          REQUIREMENTS: ${{ env.EXTRA_STR }}/extra-files/requirements-transit.txt
        run: |
          sudo apt-get update
          sudo apt-get -y install gcc-multilib gettext
          pip3 install -r $REQUIREMENTS

      - name: Prepare deployment
        id: prepare
        env:
          MODEL_NAME: ${{ inputs.model }}
          LOGIN_IP: ${{ inputs.lan_ipad }}
          LOGIN_PWD: ${{ inputs.login_pwd }}
        run: |
          cd ${{ env.EXTRA_STR }}
          python3 extra-files/transit.py

      - name: Clone sources
        run: |
          cd ${{ env.EXTRA_STR }}
          chmod +x ${{ steps.prepare.outputs.clone_sh }}
          ${{ steps.prepare.outputs.clone_sh }}

      - name: Add Plugins (SSRPlus & PassWall2 & FRPC)
        run: |
          cd lede
          git clone https://github.com/fw876/helloworld.git package/helloworld
          git clone https://github.com/xiaorouji/openwrt-passwall2.git package/passwall2

      - name: Update feeds
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Modify config
        env:
          MODIFY_SH: ${{ steps.prepare.outputs.modify_sh }}
          CPUO: ${{ inputs.cpu_overclock }}
          K515: ${{ inputs.kernel_5_15 }}
        run: |
          cd lede
          $CPUO && sed -i '/fix-cpu-clk-add-clkdev/ s/#//' $MODIFY_SH
          $K515 && sed -i '/KERNEL_PATCHVER:=5.15/ s/#//' $MODIFY_SH
          chmod +x $MODIFY_SH
          $MODIFY_SH

      - name: Generate .config & Enable Plugins
        env:
          DOT_CONFIG: ${{ steps.prepare.outputs.dot_config }}
        run: |
          cd lede
          mv ${{ env.DOT_CONFIG }} .config
          echo "CONFIG_PACKAGE_luci-app-ssr-plus=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall2=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-frpc=y" >> .config
          make defconfig

      - name: Make download
        run: |
          cd lede
          make download -j8 || make download -j1 V=s

      - name: Compile
        run: |
          cd lede
          make -j$(nproc) || make -j1 V=s

      - name: Collect files
        run: |
          cd lede
          mkdir -p _collected
          cp -r bin/targets _collected/
          cp -r bin/packages _collected/
          cd _collected
          zip -r firmware.zip *

      - name: Upload to Release
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          files: lede/_collected/firmware.zip
          tag_name: ${{ github.sha }}
          name: Custom Build ${{ github.sha }}
          body: ${{ inputs.record }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Artifact
        if: ${{ inputs.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: lede/_collected/
