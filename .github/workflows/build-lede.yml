name: build lede CR6606

on:
  workflow_dispatch:
    inputs:
      lan_ipad:
        description: 'LAN IP'
        required: false
        default: '192.168.254.1'
      login_pwd:
        description: '登录密码'
        required: false
        default: 'Quan526@'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install env
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev python3 git

      - name: Clone LEDE
        run: |
          git clone https://github.com/coolsnowwolf/lede lede
          cd lede

      - name: Add plugins
        run: |
          cd lede
          git clone https://github.com/fw876/helloworld package/helloworld
          git clone https://github.com/xiaorouji/openwrt-passwall2 package/passwall2

      - name: Update feeds
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Build config
        run: |
          cd lede
          cat > .config << EOF
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-cr6606=y
          CONFIG_PACKAGE_luci-app-ssr-plus=y
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-app-frpc=y
          # 精简
          CONFIG_PACKAGE_luci-app-qbittorrent is not set
          CONFIG_PACKAGE_luci-app-transmission is not set
          CONFIG_PACKAGE_luci-app-zerotier is not set
          CONFIG_PACKAGE_luci-app-diskman is not set
          EOF
          make defconfig

      - name: Download
        run: |
          cd lede
          make download -j8

      - name: Compile
        run: |
          cd lede
          make -j$(nproc)

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: lede/bin/targets/ramips/mt7621/*
